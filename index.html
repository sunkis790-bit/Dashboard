<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가계부</title>
<meta name="description" content="비밀번호로 잠근 개인 가계부">
<meta name="theme-color" content="#6a4cb0">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="styles.css?v=10">
</head>
<body class="locked">

<!-- 로그인 화면: 로그인 전에는 이것만 보입니다 -->
<section class="lock" id="auth" aria-label="로그인 화면">
  <div class="lock-card">
    <div class="lock-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.8 7.6h13.4a3 3 0 0 1 3 3v6.2a2.8 2.8 0 0 1-2.8 2.8H6.6a2.8 2.8 0 0 1-2.8-2.8z"/>
        <path d="M3.8 7.6V6.4a2 2 0 0 1 2-2h9.4"/>
        <circle cx="16.6" cy="13.8" r="1.15" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <h2 class="lock-title">가계부</h2>
    <p class="lock-sub">이메일과 비밀번호로 들어갑니다</p>

    <div class="seg seg-auth" id="auth-mode" role="tablist" aria-label="로그인 또는 회원가입">
      <button type="button" data-mode="signin" class="on" role="tab" aria-selected="true">로그인</button>
      <button type="button" data-mode="signup" role="tab" aria-selected="false">회원가입</button>
    </div>

    <form id="auth-form" autocomplete="on" novalidate>
      <label class="sr-only" for="auth-email">이메일</label>
      <div class="pw-field">
        <input id="auth-email" name="email" type="email" inputmode="email" autocomplete="username"
               autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next"
               placeholder="이메일" aria-describedby="auth-error">
      </div>
      <label class="sr-only" for="auth-pw">비밀번호</label>
      <div class="pw-field pw-gap">
        <input id="auth-pw" name="password" type="password" inputmode="text" autocomplete="current-password"
               autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"
               placeholder="비밀번호 (6자 이상)" aria-describedby="auth-error">
        <button class="pw-eye" id="pw-eye" type="button" aria-label="비밀번호 보기">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.2 12S5.8 5.8 12 5.8 21.8 12 21.8 12 18.2 18.2 12 18.2 2.2 12 2.2 12Z"/>
            <circle cx="12" cy="12" r="2.9"/>
          </svg>
        </button>
      </div>
      <p class="pw-error" id="auth-error" role="alert" aria-live="polite"></p>
      <button class="pw-go" id="auth-go" type="submit">로그인</button>
    </form>

    <p class="lock-note" id="auth-note">처음이면 <b>회원가입</b>에서 계정을 만들 수 있어요. 비밀번호는 6자 이상입니다.</p>
  </div>
</section>

<!-- 가계부 본문: 잠금이 풀린 뒤에만 보입니다 -->
<div class="app-shell" id="app" hidden>

  <header class="appbar">
    <div class="appbar-in">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.8 7.6h13.4a3 3 0 0 1 3 3v6.2a2.8 2.8 0 0 1-2.8 2.8H6.6a2.8 2.8 0 0 1-2.8-2.8z"/>
            <path d="M3.8 7.6V6.4a2 2 0 0 1 2-2h9.4"/>
            <circle cx="16.6" cy="13.8" r="1.15" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <div>
          <h1 id="app-title">가계부</h1>
          <p class="stamp" id="who"></p>
        </div>
      </div>
      <div class="appbar-actions">
        <button class="install" id="installBtn" hidden type="button">홈 화면에 추가</button>
        <button class="lockbtn" id="logoutBtn" type="button" aria-label="로그아웃" title="로그아웃">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 5.5h3.2a2.3 2.3 0 0 1 2.3 2.3v8.4a2.3 2.3 0 0 1-2.3 2.3H14"/>
            <path d="M9.5 8.5 6 12l3.5 3.5"/>
            <path d="M6 12h8"/>
          </svg>
          <span>로그아웃</span>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">

    <section class="view" id="view-ledger" aria-label="가계부">

      <div id="ledger-body">

        <div class="lg-head">
          <div class="month-nav">
            <button class="icon-btn" id="month-prev" type="button" aria-label="이전 달">‹</button>
            <input class="month" id="month" type="month" aria-label="기준 월">
            <button class="icon-btn" id="month-next" type="button" aria-label="다음 달">›</button>
          </div>
        </div>

        <button class="btn primary add-wide" id="entry-add-top" type="button">＋ 내역 추가</button>

        <div class="kpis" id="lg-summary"></div>

        <article class="card">
          <h2>카테고리별 지출 <span id="lg-cat-total"></span></h2>
          <div id="lg-cat-wrap"></div>
        </article>

        <article class="card">
          <h2>내역 <span id="lg-count"></span></h2>

          <div class="filters">
            <div class="seg" id="type-filter" role="group" aria-label="구분 필터">
              <button type="button" data-type="all" class="on">전체</button>
              <button type="button" data-type="expense">지출</button>
              <button type="button" data-type="income">수입</button>
            </div>
            <select class="sel" id="cat-filter" aria-label="분류 필터">
              <option value="">분류 전체</option>
            </select>
            <input class="search" id="lg-search" type="search" placeholder="제목·메모 검색" aria-label="제목·메모 검색">
          </div>

          <div class="lg-tools">
            <span class="lg-range" id="lg-range"></span>
            <button class="mini" id="sort-toggle" type="button">최신순 ↓</button>
          </div>

          <ul class="lg-list" id="lg-list"></ul>
        </article>

      </div>

      <button class="fab" id="entry-add" type="button" aria-label="내역 추가">＋</button>
    </section>

    <p class="foot" id="foot"></p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 내역 입력·수정 -->
  <div class="modal hide" id="entry-modal" role="dialog" aria-modal="true" aria-labelledby="entry-title">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="entry-title">내역 추가</h2>
        <button class="icon-btn" id="entry-close" type="button" aria-label="닫기">✕</button>
      </div>
      <form id="entry-form" autocomplete="off" novalidate>
        <div class="seg seg-type" id="entry-type" role="group" aria-label="지출/수입">
          <button type="button" data-type="expense" class="on">지출</button>
          <button type="button" data-type="income">수입</button>
        </div>

        <label class="fld amount"><span>금액</span>
          <div class="amount-box">
            <input id="entry-amount" type="text" inputmode="numeric" placeholder="0" enterkeyhint="next" aria-label="금액">
            <span class="unit">원</span>
          </div>
        </label>

        <label class="fld"><span>날짜</span><input id="entry-date" type="date"></label>

        <div class="fld">
          <span class="fld-label">분류</span>
          <div class="chips" id="cat-chips" role="group" aria-label="자주 쓰는 분류"></div>
          <input id="entry-category" list="cat-list" placeholder="분류 (직접 입력 가능)" aria-label="분류">
        </div>

        <label class="fld"><span>내용</span>
          <input id="entry-name" placeholder="점심 김치찌개">
        </label>

        <div class="fld">
          <span class="fld-label">결제수단</span>
          <div class="chips" id="pay-chips" role="group" aria-label="결제수단"></div>
          <input id="entry-pay" list="pay-list" placeholder="결제수단 (직접 입력 가능)" aria-label="결제수단">
        </div>

        <label class="fld"><span>메모 <em>선택</em></span>
          <input id="entry-memo" placeholder="메모">
        </label>

        <p class="cfg-err" id="entry-err" role="alert"></p>

        <div class="modal-actions sticky" id="entry-actions">
          <button class="btn ghost danger hide" id="entry-del" type="button">삭제</button>
          <button class="btn primary" id="entry-save" type="submit">저장</button>
        </div>
        <div class="modal-actions sticky hide" id="entry-confirm">
          <button class="btn ghost" id="confirm-no" type="button">취소</button>
          <button class="btn danger" id="confirm-yes" type="button">정말 삭제</button>
        </div>
      </form>
    </div>
  </div>

  <datalist id="cat-list"></datalist>
  <datalist id="pay-list"></datalist>
</div>

<script src="ledger-api.js?v=10"></script>
<script src="app.js?v=10"></script>
</body>
</html>
